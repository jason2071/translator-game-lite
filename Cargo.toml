[package]
name = "translator-game-lite"
version = "0.1.0"
edition = "2021"
description = "Lightweight native desktop AI game translator (Ren'Py first, engine-independent core)"
build = "build.rs"

[dependencies]
slint = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
rfd = "0.15"
dirs = "5"
regex = "1"
anyhow = "1"
flate2 = "1"

[build-dependencies]
slint-build = "1"
[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
